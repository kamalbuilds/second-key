manifest_version: 2
api_version: 1
name: second-key
version: "0.1.0"
description: >-
  A two-person rule for shared Hermes bots. Dangerous commands go to named approvers by Telegram
  DM, the person who asked can never approve their own request, and critical commands need two
  approvals. No answer, an error or too few approvers always means deny.
requires_hermes: ">=0.23.0"
license: MIT
provides_hooks:
  - pre_approval_request
  - pre_gateway_dispatch
  - pre_tool_call
config_schema:
  approvers:
    type: list
    default: []
    description: >-
      Telegram approvers and their optional aliases: the same person's ids on other platforms, and
      a local session's id (local:uid:501, printed by /secondkey) to exclude them as the requester.
  required:
    type: int
    default: 1
    description: Yes votes required for ordinary requests.
  critical_required:
    type: int
    default: 2
    description: Yes votes required when a critical pattern matches.
  critical_patterns:
    type: list
    description: >-
      Regular expressions matching critical commands. Unset, a built-in list applies: rm -rf
      variants, drop table or database, terraform destroy, git push --force, formatting a filesystem, dd to a
      /dev device, kubectl delete namespace. A list set here replaces it.
  unknown_requester_required:
    type: int
    default: 2
    description: >-
      Yes votes required when the requester identity is unknown, including a local session that
      no approver lists in aliases.
  bot_token:
    type: secret
    env: SECONDKEY_TELEGRAM_BOT_TOKEN
    description: Telegram bot token used to deliver approval requests.
author: kamalbuilds
